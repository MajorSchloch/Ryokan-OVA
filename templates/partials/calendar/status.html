<details class="calendar-file-status calendar-file-status-{{ ep.status.kind }}">
    <summary><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">{% if ep.status.kind == "available" %}<circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/>{% else if ep.status.kind == "pending" %}<path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/>{% else if ep.status.kind == "missing" %}<path d="m12 3 10 18H2Z"/><path d="M12 9v5m0 3v1"/>{% else %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>{% endif %}</svg>{{ ep.status.label }}</summary>
    <p>{{ ep.status.explanation }}</p>
    {% if !ep.status.last_check.is_empty() %}<p>{{ ep.status.last_check }}</p>{% endif %}
    <a href="/series/{{ ep.series_id }}?tab=activity">Release activity</a>
</details>
