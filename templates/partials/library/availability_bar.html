<div class="availability-bar availability-state-{{ availability.state }}" role="img" aria-label="{{ availability.description }}" title="{{ availability.label }}. {{ availability.description }}" data-available="{{ availability.downloaded }}" data-downloading="{{ availability.downloading }}" data-missing="{{ availability.missing }}" data-future="{{ availability.future }}" data-unmonitored="{{ availability.unmonitored }}" data-unknown="{{ availability.unknown }}">
    {% for segment in availability.segments %}<span class="availability-segment availability-{{ segment.kind }}" style="width: {{ segment.percent }}%" aria-hidden="true"></span>{% endfor %}
</div>
