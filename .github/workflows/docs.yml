# Build public docs with a read-only token. Only the deploy job on main
# can publish the artifact to GitHub Pages.
name: Build and deploy docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - docs-requirements.txt
      - .github/pages/**
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - docs-requirements.txt
      - .github/pages/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The version `docs-requirements.txt` was compiled for.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: Install Zensical
        # Every package is pinned with its hashes; pip refuses anything
        # else. To change versions, edit docs-requirements.in and
        # regenerate (the command is in that file).
        run: pip install --require-hashes -r docs-requirements.txt

      - name: Build site
        # `-s` (strict) upgrades broken internal links and other
        # warnings to errors so a typo'd `[link](missing.md)` fails
        # the workflow instead of shipping a 404.
        run: zensical build -s

      - name: Assemble the Pages site
        run: |
          mkdir pages
          cp .github/pages/index.html pages/index.html
          mv site pages/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
