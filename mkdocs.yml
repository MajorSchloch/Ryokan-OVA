# Config for the user-facing Ryokan docs site. The file is named
# `mkdocs.yml` for historical reasons but is consumed by Zensical,
# which reads the MkDocs config format as-is (no separate
# zensical.toml needed).
#
# `-s` (strict) is set in the build step so a broken internal link
# fails the workflow rather than shipping a 404 to users. Build
# locally with `zensical serve` from the repo root.

site_name: Ryokan OVA
site_description: Install and configure Ryokan OVA to manage your anime library.
site_url: https://majorschloch.github.io/Ryokan-OVA/docs/
repo_url: https://github.com/MajorSchloch/Ryokan-OVA
repo_name: MajorSchloch/Ryokan-OVA
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  # Palette tokens live in `docs/stylesheets/ryokan.css` so the docs site
  # exactly matches Ryokan's own UI palette (Catppuccin-mauve `#cba6f7`
  # accent, `#0f0f13` backgrounds). The `primary` / `accent` keys here
  # are placeholders Material requires for its toggle plumbing; the CSS
  # file overrides the actual color values.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # No Google Fonts. Body text is the self-hosted Noto Sans declared in
  # `docs/stylesheets/ryokan.css` (the same files the app ships under
  # `static/fonts/`); code is the self-hosted Noto Sans Mono, as in
  # the app.
  font: false

nav:
  - Getting started:
    - Welcome: index.md
    - Quick start: quick-start.md
    - Stack builder: stack-builder.md
  - Installation:
    - Docker (recommended): install.md
    - Docker reference: docker.md
    - Build from source: from-source.md
  - Guides:
    - Configuration: configuration.md
    - Configuration (cont.): system.md
    - How releases are scored: scoring.md
    - Calendar: calendar.md
    - Wanted: wanted.md
    - Importing an existing library: manual-import.md
    - Franchise folders: franchise-folders.md
    - Download clients: download-clients.md
    - External accounts: external-accounts.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md

extra_javascript:
  - javascripts/picker.js

extra_css:
  - stylesheets/ryokan.css
  - stylesheets/picker.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
